[supervisord]
nodaemon=true
logfile=logs/supervisord.log
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; Base embedding service (always running)
[program:embedding_8374]
command=uvicorn src.embedding.service:app --host 0.0.0.0 --port 8374 --workers 1
directory=%(here)s/..
environment=MKL_NUM_THREADS="4",OMP_NUM_THREADS="4",PYTHONPATH="%(here)s/.."
stdout_logfile=logs/embedding_8374.out.log
stderr_logfile=logs/embedding_8374.err.log
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=10
priority=1

; Dynamic workers (start on demand)
[program:embedding_8375]
command=uvicorn src.embedding.service:app --host 0.0.0.0 --port 8375 --workers 1
directory=%(here)s/..
environment=MKL_NUM_THREADS="4",OMP_NUM_THREADS="4",PYTHONPATH="%(here)s/.."
stdout_logfile=logs/embedding_8375.out.log
stderr_logfile=logs/embedding_8375.err.log
